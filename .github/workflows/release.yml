name: Build & Release APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mafari-release.jks

      - name: Build
        env:
          MAFARI_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          MAFARI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAFARI_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Sign release APK (fallback)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          MAFARI_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          MAFARI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAFARI_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          SDK=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          if ! $SDK/aapt2 dump badging "$APK" >/dev/null 2>&1; then
            echo "release apk invalid, fallback to signing debug apk"
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
            APK=app/build/outputs/apk/release/app-release.apk
          fi
          if ! $SDK/apksigner verify "$APK" >/dev/null 2>&1; then
            $SDK/zipalign -f 4 "$APK" aligned.apk
            $SDK/apksigner sign --ks mafari-release.jks \
              --ks-pass "pass:$MAFARI_STORE_PASS" \
              --key-pass "pass:$MAFARI_KEY_PASS" \
              --ks-key-alias "$MAFARI_KEY_ALIAS" \
              --out app/build/outputs/apk/release/mafari-release-signed.apk aligned.apk
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mafari-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
