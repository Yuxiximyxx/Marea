name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Install Android SDK packages
        run: |
          set -x
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" 2>&1 | tail -5 || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 

      - name: Prepare keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > mafari-release.jks

      - name: Build
        env:
          MAFARI_KEYSTORE: ${{ env.KEYSTORE_BASE64 != '' && 'mafari-release.jks' || '' }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          set -e
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > mafari-release.jks
          fi
          if ! "$SDK/aapt2" dump badging "$APK" >/dev/null 2>&1; then
            echo "release apk 结构无效，改用 debug 包"
            cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            "$SDK/zipalign" -f 4 "$APK" aligned.apk
            "$SDK/apksigner" sign --ks mafari-release.jks \
              --ks-pass "pass:$STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out app/build/outputs/apk/release/mafari-release-signed.apk aligned.apk
            echo "SIGNED=app/build/outputs/apk/release/mafari-release-signed.apk" >> "$GITHUB_ENV"
          else
            echo "SIGNED=$APK" >> "$GITHUB_ENV"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mafari-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
